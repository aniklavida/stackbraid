<div class="flex min-h-screen flex-1 flex-col sm:flex-row bg-[var(--bg)] text-[var(--ink)]">
  <aside class="flex flex-col border-b sm:border-b-0 sm:border-r border-[var(--bd)] bg-[var(--rail)] px-4 py-4 sm:py-5 w-full sm:w-56 md:w-60 shrink-0">
    <div class="mb-4 sm:mb-6 flex items-center justify-between sm:justify-start gap-2">
      <span class="font-display text-lg font-semibold tracking-tight text-[var(--ink)]">
        {{ "admin.title" | transloco }}
      </span>
      <a
        routerLink="/"
        class="text-xs font-medium text-[var(--mut)] hover:text-[var(--ink)] hover:underline inline-flex sm:hidden items-center gap-1"
      >
        &larr; {{ "admin.nav.backToSite" | transloco }}
      </a>
    </div>
    <nav class="flex flex-row sm:flex-col gap-1 overflow-x-auto">
      <a
        routerLink="/admin/users"
        routerLinkActive="bg-[var(--act)] text-[var(--ink)] font-semibold shadow-[var(--shadow-card)]"
        class="rounded-[var(--r-sm)] px-3 py-2 text-sm font-medium transition-colors text-[var(--ink2)] hover:bg-[var(--hov)] hover:text-[var(--ink)] whitespace-nowrap"
      >
        {{ "admin.nav.users" | transloco }}
      </a>
      <a
        routerLink="/admin/roles"
        routerLinkActive="bg-[var(--act)] text-[var(--ink)] font-semibold shadow-[var(--shadow-card)]"
        class="rounded-[var(--r-sm)] px-3 py-2 text-sm font-medium transition-colors text-[var(--ink2)] hover:bg-[var(--hov)] hover:text-[var(--ink)] whitespace-nowrap"
      >
        {{ "admin.nav.roles" | transloco }}
      </a>
    </nav>
    <div class="mt-auto pt-4 border-t border-[var(--bd)] hidden sm:block">
      <a
        routerLink="/"
        class="text-xs font-medium text-[var(--mut)] hover:text-[var(--ink)] hover:underline inline-flex items-center gap-1"
      >
        &larr; {{ "admin.nav.backToSite" | transloco }}
      </a>
    </div>
  </aside>
  <div class="flex flex-1 flex-col min-w-0">
    <header class="sticky top-0 z-30 flex items-center justify-between border-b border-[var(--bd)] bg-[var(--surf)] px-4 sm:px-6 h-[var(--h-lg)]">
      <div class="text-xs font-mono uppercase tracking-wider text-[var(--mut)]">
        Console
      </div>
      <div class="flex items-center gap-2">
        <app-locale-switcher />
        <app-theme-toggle />
      </div>
    </header>
    <main class="flex-1 px-4 sm:px-8 py-6 sm:py-8 overflow-y-auto">
      <div class="mx-auto max-w-5xl">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>StackBraid</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('stackbraid.theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Runtime backend selection (public/env.js) — loaded before the app
       bundle so shared/config/env.ts sees it on first read. Editing this one
       file points the same compiled build at either backend; the app itself
       never changes. -->
  <script src="env.js"></script>
  <app-root></app-root>
</body>
</html>

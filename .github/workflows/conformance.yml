name: Conformance suite

on:
  push:
    branches: [main]
    paths:
      - 'contract/**'
      - '.github/workflows/conformance.yml'
  pull_request:
    paths:
      - 'contract/**'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prove the suite catches every documented violation class
        working-directory: contract/conformance
        run: |
          set -euo pipefail
          echo "No backend exists yet (see docs/SPEC.md). This job runs the"
          echo "conformance suite only against its own stub fixture — proving"
          echo "the suite catches wrong types, missing fields, wrong timestamp"
          echo "formats, wrong error shapes and wrong pagination — not that any"
          echo "real backend conforms."
          npm run demo:violations

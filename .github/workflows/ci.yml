name: CI

# Build, test, lint, and verify the full StackBraid matrix: the infra compose
# file, generated clients and drift check, licence audit, both .NET and Python
# backends (unit, integration, architecture, conformance), both Angular and
# Next.js frontends (unit, architecture, e2e), and the Flutter mobile shell.
#
# The client-drift job closes a known gap: the drift check previously ran
# only through an opt-in local pre-commit hook
# (.githooks/pre-commit, enabled via `git config core.hooksPath .githooks`),
# so an unconfigured clone or a `--no-verify` commit could push drifted
# clients. Running it here makes the guarantee independent of local
# configuration.
#
# The dependency-licences job exists because every dependency shipped here is
# inherited by every user of this skeleton (see AGENTS.md "Dependencies"),
# so a version bump or a new dependency that nobody re-audited must fail the
# build the same way a drifted generated client does. See docs/DEPENDENCIES.md.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and yamllint
        run: sudo apt-get update && sudo apt-get install -y shellcheck yamllint

      - name: Shellcheck all shell scripts
        run: shellcheck scripts/*.sh .githooks/pre-commit

      - name: Verify multi-host pointers
        run: |
          ./scripts/check-host-pointers.sh --self-test
          ./scripts/check-host-pointers.sh
          ./scripts/generate-host-pointers.sh --check

      - name: Lint YAML (infra, workflows)
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}" \
            infra/compose.yaml \
            infra/prometheus/prometheus.yml \
            infra/loki/loki-config.yaml \
            infra/grafana/provisioning/datasources/datasources.yml \
            infra/grafana/provisioning/dashboards/dashboards.yml \
            .github/workflows

      - name: Validate Grafana dashboard JSON
        run: |
          for f in infra/grafana/dashboards/*.json; do
            python3 -m json.tool "$f" > /dev/null
          done

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@2.52.1 lint contract/openapi.yaml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate infra/compose.yaml
        run: docker compose -f infra/compose.yaml config

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build the TypeScript client
        working-directory: clients/typescript
        run: |
          npm ci
          npm run typecheck

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'

      - name: Fetch the Dart client's dependencies
        working-directory: clients/dart
        run: dart pub get

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'

      - name: Run the Dart client's tests
        working-directory: clients/dart
        run: |
          dart pub get
          dart test

  client-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'

      - name: Check generated clients for drift against the contract
        run: ./scripts/check-client-drift.sh

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.100'

      - name: Restore (locked mode — fails on any drift from packages.lock.json)
        working-directory: backends/dotnet
        run: dotnet restore StackBraid.sln --locked-mode

      - name: Build
        working-directory: backends/dotnet
        run: dotnet build StackBraid.sln --no-restore --configuration Release

      - name: Run unit and architecture tests
        working-directory: backends/dotnet
        run: |
          dotnet test tests/Shared.UnitTests/StackBraid.Shared.UnitTests.csproj --no-restore --configuration Release
          dotnet test tests/Features.Identity.UnitTests/StackBraid.Features.Identity.UnitTests.csproj --no-restore --configuration Release
          dotnet test tests/ArchitectureTests/StackBraid.ArchitectureTests.csproj --no-restore --configuration Release
          dotnet test tests/Database.UnitTests/StackBraid.Database.UnitTests.csproj --no-restore --configuration Release

  database-providers:
    name: providers (${{ matrix.backend }} + ${{ matrix.provider }})
    runs-on: ubuntu-latest
    # Every backend x provider combination, proving each provider's project
    # builds and its own DI/query-translation (or dialect/DDL) tests pass
    # without a live server. The live-database conformance legs for SQL Server
    # and MySQL run as service containers in conformance.yml; this job is the
    # part that can run on a plain runner, so a provider that stops compiling
    # or registering fails the build on its own, not only in a live leg.
    strategy:
      fail-fast: false
      matrix:
        backend: [dotnet, python]
        provider: [postgres, sqlserver, mysql]
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        if: matrix.backend == 'dotnet'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.100'

      - name: Build and run the .NET provider tests for this provider
        if: matrix.backend == 'dotnet'
        working-directory: backends/dotnet
        run: |
          dotnet restore StackBraid.sln --locked-mode
          dotnet build StackBraid.sln --no-restore --configuration Release
          dotnet test tests/Database.UnitTests/StackBraid.Database.UnitTests.csproj --no-restore --configuration Release --filter "FullyQualifiedName~${{ matrix.provider }}"
          dotnet test tests/ArchitectureTests/StackBraid.ArchitectureTests.csproj --no-restore --configuration Release

      - uses: actions/setup-python@v7
        if: matrix.backend == 'python'
        with:
          python-version: '3.12'

      - name: Install uv
        if: matrix.backend == 'python'
        run: pip install uv

      - name: Install unixODBC so pyodbc can load (SQL Server driver manager)
        if: matrix.backend == 'python' && matrix.provider == 'sqlserver'
        run: sudo apt-get update && sudo apt-get install -y unixodbc

      - name: Install dependencies (locked)
        if: matrix.backend == 'python'
        working-directory: backends/python
        run: uv pip install --system -r requirements-lock.txt

      - name: Run the Python provider dialect/DDL tests for this provider
        if: matrix.backend == 'python'
        working-directory: backends/python
        run: PYTHONPATH=src pytest tests/database -k "${{ matrix.provider }}"

  dotnet-integration:
    runs-on: ubuntu-latest
    # A real Postgres, via a GitHub Actions service container — not
    # Testcontainers, not the repository's own start-local-postgres.sh
    # (that script exists for a contributor's machine; CI already has a
    # container engine, so a service container is the natural equivalent).
    # Same image and tag as infra/compose.yaml, so what CI tests against
    # matches what a real deployment runs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stackbraid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.100'

      - name: Restore (locked mode — fails on any drift from packages.lock.json)
        working-directory: backends/dotnet
        run: dotnet restore StackBraid.sln --locked-mode

      - name: Run integration tests against the service-container Postgres
        working-directory: backends/dotnet
        env:
          STACKBRAID_TEST_POSTGRES_CONNECTION_STRING: "Host=localhost;Port=5432;Database=stackbraid_test;Username=postgres;Password=postgres"
        run: dotnet test tests/Features.Identity.IntegrationTests/StackBraid.Features.Identity.IntegrationTests.csproj --no-restore --configuration Release

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (locked — from the committed requirements-lock.txt)
        working-directory: backends/python
        run: uv pip install --system -r requirements-lock.txt

      - name: Run unit tests
        working-directory: backends/python
        run: PYTHONPATH=src pytest tests/shared tests/features

      - name: Run import-linter architecture contracts
        working-directory: backends/python/src
        run: lint-imports --config ../pyproject.toml

  python-integration:
    runs-on: ubuntu-latest
    # Same reasoning as dotnet-integration above: a GitHub Actions service
    # container standing in for the repository's own no-Docker
    # scripts/start-local-postgres.sh, same image and tag as infra/compose.yaml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stackbraid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (locked — from the committed requirements-lock.txt)
        working-directory: backends/python
        run: uv pip install --system -r requirements-lock.txt

      - name: Run integration tests against the service-container Postgres
        working-directory: backends/python
        env:
          STACKBRAID_POSTGRES_DSN: "postgresql+asyncpg://postgres:postgres@localhost:5432/stackbraid_test"
        run: PYTHONPATH=src pytest tests/integration

  dependency-licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Check every resolved dependency is audited, at the audited version, on an accepted licence
        run: node scripts/check-dependency-licenses.mjs

  create-picker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check create picker combinations (no leaked stacks, reproducible output)
        run: node scripts/check-create-picker.mjs

  conformance-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Prove the suite catches every documented violation class
        working-directory: contract/conformance
        run: |
          set -euo pipefail
          npm run demo:violations

  dotnet-conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stackbraid
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.100'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Restore and build (locked mode)
        working-directory: backends/dotnet
        run: |
          dotnet restore StackBraid.sln --locked-mode
          dotnet build StackBraid.sln --no-restore --configuration Release

      - name: Start the backend against the service-container Postgres
        working-directory: backends/dotnet
        env:
          Jwt__AccessTokenLifetimeSeconds: '5'
        run: |
          nohup dotnet run --no-restore --no-build --configuration Release --project src/Host --urls http://127.0.0.1:8080 > dotnet-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health/ready > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "Backend did not become ready in time:"; cat dotnet-backend.log; exit 1

      - name: Run contract/conformance against the .NET backend
        working-directory: contract/conformance
        env:
          CONFORMANCE_ADMIN_EMAIL: admin@stackbraid.local
          CONFORMANCE_ADMIN_PASSWORD: ChangeMe!123
        run: node cli/run.mjs http://127.0.0.1:8080

  python-conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stackbraid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (locked — from the committed requirements-lock.txt)
        working-directory: backends/python
        run: uv pip install --system -r requirements-lock.txt

      - name: Start the backend against the service-container Postgres
        working-directory: backends/python
        env:
          STACKBRAID_POSTGRES_DSN: "postgresql+asyncpg://postgres:postgres@localhost:5432/stackbraid_test"
          STACKBRAID_JWT_ACCESS_TOKEN_LIFETIME_SECONDS: '5'
        run: |
          nohup env PYTHONPATH=src uvicorn app.host.main:app --host 127.0.0.1 --port 8080 > python-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health/ready > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "Backend did not become ready in time:"; cat python-backend.log; exit 1

      - name: Run contract/conformance against the Python backend
        working-directory: contract/conformance
        env:
          CONFORMANCE_ADMIN_EMAIL: admin@stackbraid.local
          CONFORMANCE_ADMIN_PASSWORD: ChangeMe!123
        run: node cli/run.mjs http://127.0.0.1:8080

  nextjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontends/nextjs
        run: npm ci

      - name: Typecheck
        working-directory: frontends/nextjs
        run: npm run typecheck

      - name: Lint
        working-directory: frontends/nextjs
        run: npm run lint

      - name: Check architecture layering (dependency-cruiser)
        working-directory: frontends/nextjs
        run: npm run arch:check

      - name: Run unit tests
        working-directory: frontends/nextjs
        run: npm test

  angular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontends/angular
        run: npm ci

      - name: Typecheck
        working-directory: frontends/angular
        run: npm run typecheck

      - name: Lint
        working-directory: frontends/angular
        run: npm run lint

      - name: Check architecture layering (dependency-cruiser)
        working-directory: frontends/angular
        run: npm run arch:check

      - name: Run unit tests
        working-directory: frontends/angular
        run: npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile/flutter
        run: flutter pub get

      - name: Analyze
        working-directory: mobile/flutter
        run: flutter analyze

      - name: Run unit and architecture tests
        working-directory: mobile/flutter
        run: flutter test

  e2e:
    name: e2e (${{ matrix.frontend }} + ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: [nextjs, angular]
        backend: [dotnet, python]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stackbraid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up .NET (if testing .NET backend)
        if: matrix.backend == 'dotnet'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.100'

      - name: Set up Python (if testing Python backend)
        if: matrix.backend == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Start backend against the service-container Postgres
        run: |
          set -euo pipefail
          if [ "${{ matrix.backend }}" = "dotnet" ]; then
            cd backends/dotnet
            dotnet restore StackBraid.sln --locked-mode
            dotnet build StackBraid.sln --no-restore --configuration Release
            nohup env \
              ConnectionStrings__Postgres="Host=127.0.0.1;Port=5432;Database=stackbraid_test;Username=postgres;Password=postgres" \
              Cors__AllowedOrigins__0="http://127.0.0.1:3000" \
              Cors__AllowedOrigins__1="http://127.0.0.1:4200" \
              dotnet run --no-restore --no-build --configuration Release --project src/Host --urls http://127.0.0.1:8080 > dotnet-backend.log 2>&1 &
          else
            cd backends/python
            pip install uv
            uv pip install --system -r requirements-lock.txt
            nohup env \
              PYTHONPATH=src \
              STACKBRAID_POSTGRES_DSN="postgresql+asyncpg://postgres:postgres@localhost:5432/stackbraid_test" \
              STACKBRAID_CORS_ALLOWED_ORIGINS_RAW="http://127.0.0.1:3000,http://127.0.0.1:4200" \
              uvicorn app.host.main:app --host 127.0.0.1 --port 8080 > python-backend.log 2>&1 &
          fi
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health/ready > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start in time:"
          if [ "${{ matrix.backend }}" = "dotnet" ]; then cat backends/dotnet/dotnet-backend.log; else cat backends/python/python-backend.log; fi
          exit 1

      - name: Install frontend dependencies and Playwright browsers
        run: |
          cd frontends/${{ matrix.frontend }}
          npm ci
          npx playwright install --with-deps chromium

      - name: Start frontend and run Playwright e2e test
        run: |
          set -euo pipefail
          cd frontends/${{ matrix.frontend }}
          if [ "${{ matrix.frontend }}" = "nextjs" ]; then
            NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8080 npm run build
            nohup npm run start -- -p 3000 > nextjs.log 2>&1 &
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:3000 > /dev/null 2>&1; then break; fi
              sleep 1
            done
            PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm run test:e2e
          else
            nohup npx ng serve --host 127.0.0.1 --port 4200 > angular.log 2>&1 &
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:4200 > /dev/null 2>&1; then break; fi
              sleep 1
            done
            PLAYWRIGHT_BASE_URL=http://127.0.0.1:4200 npm run test:e2e
          fi

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
      - test
      - client-drift
      - dependency-licences
      - create-picker
      - dotnet
      - dotnet-integration
      - dotnet-conformance
      - python
      - python-integration
      - python-conformance
      - database-providers
      - conformance-self-check
      - nextjs
      - angular
      - flutter
      - e2e
    steps:
      - name: Verify full matrix green
        run: echo "All matrix suites and gates passed successfully."

name: CI

# Build, test and lint for everything that exists today — the infra compose
# file, the two generated clients, and the .NET backend under construction
# (see docs/ROADMAP.md step 2). There is no frontend or mobile app yet (see
# AGENTS.md). Contract conformance is covered separately by conformance.yml.
#
# The client-drift job closes a known gap: the drift check previously ran
# only through an opt-in local pre-commit hook
# (.githooks/pre-commit, enabled via `git config core.hooksPath .githooks`),
# so an unconfigured clone or a `--no-verify` commit could push drifted
# clients. Running it here makes the guarantee independent of local
# configuration.
#
# The dependency-licences job exists because every dependency shipped here is
# inherited by every user of this skeleton (see AGENTS.md "Dependencies"),
# so a version bump or a new dependency that nobody re-audited must fail the
# build the same way a drifted generated client does. See docs/DEPENDENCIES.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and yamllint
        run: sudo apt-get update && sudo apt-get install -y shellcheck yamllint

      - name: Shellcheck all shell scripts
        run: shellcheck scripts/*.sh .githooks/pre-commit

      - name: Lint YAML (infra, workflows)
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}" \
            infra/compose.yaml \
            infra/prometheus/prometheus.yml \
            infra/loki/loki-config.yaml \
            infra/grafana/provisioning/datasources/datasources.yml \
            infra/grafana/provisioning/dashboards/dashboards.yml \
            .github/workflows

      - name: Validate Grafana dashboard JSON
        run: |
          for f in infra/grafana/dashboards/*.json; do
            python3 -m json.tool "$f" > /dev/null
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate infra/compose.yaml
        run: docker compose -f infra/compose.yaml config

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the TypeScript client
        working-directory: clients/typescript
        run: |
          npm ci
          npm run typecheck

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'

      - name: Fetch the Dart client's dependencies
        working-directory: clients/dart
        run: dart pub get

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'

      - name: Run the Dart client's tests
        working-directory: clients/dart
        run: |
          dart pub get
          dart test

  client-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'

      - name: Check generated clients for drift against the contract
        run: ./scripts/check-client-drift.sh

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'

      - name: Restore (locked mode — fails on any drift from packages.lock.json)
        working-directory: backends/dotnet
        run: dotnet restore StackBraid.sln --locked-mode

      - name: Build
        working-directory: backends/dotnet
        run: dotnet build StackBraid.sln --no-restore --configuration Release

      - name: Run unit and architecture tests
        working-directory: backends/dotnet
        run: |
          dotnet test tests/Shared.UnitTests/StackBraid.Shared.UnitTests.csproj --no-restore --configuration Release
          dotnet test tests/Features.Identity.UnitTests/StackBraid.Features.Identity.UnitTests.csproj --no-restore --configuration Release
          dotnet test tests/ArchitectureTests/StackBraid.ArchitectureTests.csproj --no-restore --configuration Release

  dependency-licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check every resolved dependency is audited, at the audited version, on an accepted licence
        run: node scripts/check-dependency-licenses.mjs

# StackBraid infrastructure.
#
# Six services, wired for local development: Postgres, RabbitMQ, Redis for
# the data plane; Prometheus, Loki and Grafana for observability. No backend
# exists yet (see ../AGENTS.md and ../docs/ROADMAP.md) — nothing here talks
# to application code, but the observability trio talks to itself and to
# RabbitMQ's own metrics, so Grafana has something real to show from the
# first `docker compose up`.
#
# Every value below has a working default so this file runs with no `.env`
# file at all. Copy ../.env.example to ../.env to override any of them —
# see that file for what each variable does.
#
# Usage (from the repository root):
#   docker compose -f infra/compose.yaml up -d
#   docker compose -f infra/compose.yaml down          # stop
#   docker compose -f infra/compose.yaml down -v       # stop and wipe data
#
# NOTE on the Redis image tag: this pins redis:7.2-alpine deliberately, not
# the newer 7-alpine/7.4+ line. Redis Ltd. relicensed Redis 7.4 and later
# under RSALv2/SSPLv1, and this project's own AGENTS.md rejects
# SSPL-style licences "regardless of quality." Redis 7.2 is the last release
# under the original BSD 3-Clause licence, so that is what ships here.

name: stackbraid

networks:
  stackbraid:
    name: stackbraid

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stackbraid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackbraid}
      POSTGRES_DB: ${POSTGRES_DB:-stackbraid}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stackbraid
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stackbraid} -d ${POSTGRES_DB:-stackbraid}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-stackbraid}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-stackbraid}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - stackbraid
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-stackbraid}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - stackbraid
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-stackbraid} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on:
      - rabbitmq
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - stackbraid
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  loki:
    image: grafana/loki:2.9.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - stackbraid
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - stackbraid
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

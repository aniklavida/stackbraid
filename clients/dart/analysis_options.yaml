analyzer:
  language:
    strict-inference: true
    strict-raw-types: true
    strict-casts: false
  exclude:
    - test/*.dart
    - lib/src/model/*.g.dart
  errors:
    deprecated_member_use_from_same_package: ignore
    # Generated model files each import every sibling model for the
    # discriminator-based oneOf (RealtimeMessage); some end up unused per
    # file. Cosmetic, and this is generated code we do not hand-edit.
    unused_import: ignore
